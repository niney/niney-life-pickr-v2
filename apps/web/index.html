<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Pickr</title>
    <!-- Pretendard 변수 폰트 (동적 서브셋). 공개 페이지 한정 적용 — Tailwind 의
         font-pretendard 유틸로 켠다. 어드민은 system-ui 그대로. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      integrity="sha384-/uC/GIvKJ/9RN6i1izHoBY9ubYo60OAsQRNQ3NRFiNsN+N/MVQJHD5OYcZz6wvwn"
      crossorigin="anonymous"
    />
    <!-- 타로 페이지 타이틀용 세리프. Google Fonts CSS 는 unicode-range 로 쪼개져 실제 쓰인
         글리프 범위만 받는다. Tailwind font-serif-kr 유틸로 켠다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap"
    />
    <script>
      // FOUC 방지: React 마운트 전에 저장된 테마를 <html>에 반영.
      (function () {
        try {
          var stored = localStorage.getItem('lp:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
