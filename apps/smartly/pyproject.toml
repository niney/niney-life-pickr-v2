[project]
name = "smartly"
version = "0.0.0"
description = "AI 허브 관광 음식메뉴판(71553) 모델 체험 서버 — 메뉴명 OCR·4개 언어 번역 (로컬 임시)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "torch>=2.6",
    "numpy",
    "pillow",
    "pandas",
    # 번역(OpenNMT-py 2.2 포크)이 쓰는 레거시 Field API 는 0.5.0 에만 있다(순수 파이썬 휠).
    "torchtext==0.5.0",
    "python-mecab-ko>=1.3.7",
    "configargparse",
    "pyyaml",
    "six",
    "requests",
    "sentencepiece",
    "tqdm",
    "jiwer",
    "nltk",
]

[dependency-groups]
dev = ["pytest>=8", "httpx"]

[tool.uv]
# 설치하는 패키지가 아니라 apps/smartly 를 작업 폴더로 두고 돌리는 앱 — smartly/ 와 onmt/ 를 그대로 import 한다.
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx`"]
